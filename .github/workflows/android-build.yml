# Android üretim derlemesi GitHub'ın sunucusunda (EAS yerel derleme): Expo'nun aylık bulut derleme hakkını kullanmaz.
# Çalıştırma: GitHub › Actions › "Android derlemesi" › Run workflow. Bitince AAB dosyası çalışmanın sayfasındaki "Artifacts"
# bölümünden indirilir. Depo herkese açık olduğu için AAB Releases'e konmaz; artifact 3 gün sonra kendiliğinden silinir.
# Gerekli gizli anahtar: EXPO_TOKEN (expo.dev › Account settings › Access tokens). İmza anahtarı Expo hesabından otomatik iner.
name: Android derlemesi

on:
  workflow_dispatch:
  # android-build dalına gönderilen her commit derlemeyi kendiliğinden başlatır (elle başlatmaya gerek kalmaz)
  push:
    branches: [android-build]

permissions:
  contents: read

jobs:
  android:
    # Android SDK'sı hazır gelen sürüm (ubuntu-latest Ubuntu 26'ya geçti)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Gradle'a daha fazla bellek; derleme sırasında bellek yetersizliği olmasın
      GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Derle (AAB)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: npx --yes eas-cli@latest build -p android --profile production --local --non-interactive --output ./YOL-android.aab 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # AAB'yi çalışmanın Artifacts bölümüne koy (herkese açık Releases'e değil; 3 gün sonra silinir)
      - name: AAB'yi sakla
        uses: actions/upload-artifact@v4
        with:
          name: YOL-android-aab
          path: YOL-android.aab
          retention-days: 3
          if-no-files-found: error

      # Hata olursa son günlük satırları çalışmanın özet sayfasına yazılır
      - if: failure()
        run: |
          echo '### Derleme günlüğünün son satırları' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'build.log yok (derleme adımına gelinmedi)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
