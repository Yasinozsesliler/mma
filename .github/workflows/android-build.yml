# Android üretim derlemesi GitHub'ın sunucusunda (EAS yerel derleme): Expo'nun aylık bulut derleme hakkını kullanmaz.
# Çalıştırma: GitHub › Actions › "Android derlemesi" › Run workflow. Bitince AAB dosyası "Artifacts" bölümünden indirilir.
# Gerekli gizli anahtar: EXPO_TOKEN (expo.dev › Account settings › Access tokens). İmza anahtarı Expo hesabından otomatik iner.
name: Android derlemesi

on:
  workflow_dispatch:

jobs:
  android:
    # Android SDK'sı hazır gelen sürüm (ubuntu-latest Ubuntu 26'ya geçti)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Gradle'a daha fazla bellek; derleme sırasında bellek yetersizliği olmasın
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıklar
        run: npm ci

      - name: Derle (AAB)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: npx --yes eas-cli@latest build -p android --profile production --local --non-interactive --output ./YOL-android.aab 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        with:
          name: YOL-android-aab
          path: YOL-android.aab
          retention-days: 14

      # Hata olursa son günlük satırları ayrı bir dosya olarak indirilebilir
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: build.log
          retention-days: 7
