# Google Play'e otomatik yükleme: mağaza metinleri, ekran görüntüleri, tanıtım görseli ve isteğe bağlı AAB.
# Çalıştırma: play-magaza dalına push. Ne yükleneceği store/play-yukle.json'da:
#   {"isler": "metin,gorsel,aab", "kanal": "production", "aab_run_id": "", "notlar": "play-whatsnew-1.3.2.txt", "deneme": false}
# (İş akışı ana dala da eklenirse Actions › "Google Play'e yükle" › Run workflow ile de çalışır.)
# Gizli anahtar: PLAY_SERVICE_ACCOUNT_JSON (Google Cloud hizmet hesabının JSON anahtarı; Play Console'da yetkili).
# AAB için: Android derlemesi iş akışının çalışma numarası (run id) verilir; o çalışmanın AAB'si taslak sürüm olarak yüklenir.
name: Google Play'e yükle

on:
  workflow_dispatch:
    inputs:
      isler:
        description: 'Ne yüklensin (virgüllü: metin, gorsel, aab)'
        default: 'metin,gorsel'
      kanal:
        description: 'AAB için kanal (production, beta, alpha, internal)'
        default: 'production'
      aab_run_id:
        description: 'AAB için Android derlemesi çalışma numarası (boşsa en son başarılı derleme)'
        default: ''
      notlar:
        description: 'Sürüm notları dosyası (store/ içinde)'
        default: ''
      deneme:
        description: 'Deneme (Play''de hiçbir şeyi değiştirme, yalnızca doğrula)'
        type: boolean
        default: false
  push:
    branches: [play-magaza]

permissions:
  contents: read
  actions: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Ayarlar
        id: ay
        run: |
          node -e '
            const fs = require("fs");
            const f = fs.existsSync("store/play-yukle.json") ? JSON.parse(fs.readFileSync("store/play-yukle.json", "utf8")) : {};
            const i = ${{ toJSON(github.event.inputs) }} || {};
            const v = (k, d) => (i[k] !== undefined && i[k] !== "" ? i[k] : f[k] !== undefined ? f[k] : d);
            const out = { isler: v("isler", "metin,gorsel"), kanal: v("kanal", "production"), aab_run_id: v("aab_run_id", ""), notlar: v("notlar", ""), deneme: String(v("deneme", false)) === "true" ? "1" : "0" };
            for (const [k, x] of Object.entries(out)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${x}\n`);
            console.log(out);
          '

      - name: AAB'yi al
        if: contains(steps.ay.outputs.isler, 'aab')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.ay.outputs.aab_run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Android derlemesi: $RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name YOL-android-aab --dir aab
          ls -la aab

      - name: Play'e yükle
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_ISLER: ${{ steps.ay.outputs.isler }}
          PLAY_KANAL: ${{ steps.ay.outputs.kanal }}
          PLAY_NOTLAR: ${{ steps.ay.outputs.notlar && format('store/{0}', steps.ay.outputs.notlar) || '' }}
          PLAY_DENEME: ${{ steps.ay.outputs.deneme }}
          PLAY_AAB: aab/YOL-android.aab
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "PLAY_SERVICE_ACCOUNT_JSON gizli anahtarı eksik"; exit 1; fi
          node scripts/play-publish.mjs
