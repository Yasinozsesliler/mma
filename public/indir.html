<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YOL: Kafesten Kemere</title>
<meta property="og:title" content="YOL: Kafesten Kemere" />
<meta property="og:description" content="MMA kariyer oyunu. Ücretsiz indir." />
<meta property="og:image" content="/icon-512.png" />
<link rel="icon" href="/icon-192.png" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 16px; box-sizing: border-box; }
  img { width: 128px; height: 128px; border-radius: 30px; box-shadow: 0 0 40px rgba(230, 57, 70, .45); }
  a { display: block; width: 100%; max-width: 340px; padding: 18px; border-radius: 14px; background: #f2c14e; color: #111; text-align: center; font-size: 18px; font-weight: 800; text-decoration: none; box-sizing: border-box; }
</style>
</head>
<body>
  <img src="/icon-512.png" alt="YOL" />
  <a id="git" href="https://play.google.com/store/apps/details?id=com.yolmma.game">Google Play'de aç</a>
<script>
  // Instagram'ın Android tarayıcısı Play bağlantısını Play Store'a aktarmıyor; market:// ile Play Store uygulaması açılır.
  // iPhone'da App Store'a, diğer yerlerde normal Play sayfasına gider.
  (function () {
    var ua = navigator.userAgent || '';
    var a = document.getElementById('git');
    var src = /Instagram/i.test(ua) ? 'instagram' : /FBAN|FBAV|FB_IAB/i.test(ua) ? 'facebook' : /TikTok|musical_ly/i.test(ua) ? 'tiktok' : 'web';
    var ref = '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=link');
    if (/iPhone|iPad|iPod/i.test(ua)) {
      a.textContent = "App Store'da aç";
      a.href = 'https://apps.apple.com/app/id6823537918';
      location.replace(a.href);
    } else if (/Android/i.test(ua)) {
      a.href = 'market://details?id=com.yolmma.game' + ref;
      location.href = a.href;
    } else {
      a.href += ref;
    }
  })();
</script>
</body>
</html>
