<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1200" height="1000"></canvas>
<script>
// Dövüş salonu: tuğla duvar, sarkıt lambalar, kum torbaları, tatami zemin, pencere ışığı. Marka yok.
const c = document.getElementById('c'); let g = c.getContext('2d'); const W = c.width, H = c.height;
let seed = 7; const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const floorY = 760;

// 1) Tuğla duvar
g.fillStyle = '#1a1412'; g.fillRect(0, 0, W, floorY);
const bh = 26, bw = 78;
for (let row = 0; row * bh < floorY; row++) {
  const off = row % 2 ? bw / 2 : 0;
  for (let x = -bw; x < W + bw; x += bw) {
    const v = 0.75 + R() * 0.5;
    g.fillStyle = `rgb(${(58 * v) | 0},${(34 * v) | 0},${(28 * v) | 0})`;
    g.fillRect(x + off + 2, row * bh + 2, bw - 4, bh - 4);
    if (R() < 0.25) { g.fillStyle = `rgba(0,0,0,${0.2 + R() * 0.3})`; g.fillRect(x + off + 2 + R() * 40, row * bh + 2, 10 + R() * 30, bh - 4); }
  }
}
// boyalı alt şerit (koyu) ve kırmızı ince çizgi
g.fillStyle = '#121418'; g.fillRect(0, 470, W, floorY - 470);
g.fillStyle = '#c1121f'; g.fillRect(0, 462, W, 8);
g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(0, 470, W, 3);
// arka duvarda tel örgü bölme (antrenman kafesi) ve köşe direkleri
g.save(); g.beginPath(); g.rect(300, 300, 600, floorY - 310); g.clip();
g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(300, 300, 600, floorY - 310);
g.strokeStyle = 'rgba(150,160,175,0.22)'; g.lineWidth = 1.1; const hh = floorY - 300;
for (let x = 300 - hh; x < 900 + hh; x += 14) { g.beginPath(); g.moveTo(x, 300); g.lineTo(x + hh, floorY); g.stroke(); g.beginPath(); g.moveTo(x + hh, 300); g.lineTo(x, floorY); g.stroke(); }
g.restore();
g.fillStyle = '#0d0e11'; g.fillRect(290, 286, 620, 16);
[300, 900].forEach((x) => { g.fillStyle = '#0a0b0d'; g.fillRect(x - 8, 286, 16, floorY - 286); g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(x - 5, 286, 3, floorY - 286); });
g.fillStyle = '#c1121f'; g.fillRect(290, 288, 620, 4);
// 2) Yüksek pencereler ve içeri vuran ışık
[[160, 70], [500, 70], [840, 70]].forEach(([x, y]) => {
  g.fillStyle = '#0b0d12'; g.fillRect(x - 6, y - 6, 212, 132);
  const wg = g.createLinearGradient(x, y, x + 200, y + 120); wg.addColorStop(0, '#5b6b84'); wg.addColorStop(1, '#2a3346');
  g.fillStyle = wg; g.fillRect(x, y, 200, 120);
  g.fillStyle = '#0b0d12'; g.fillRect(x + 97, y, 6, 120); g.fillRect(x, y + 57, 200, 6);
  g.save(); g.globalCompositeOperation = 'lighter'; g.filter = 'blur(28px)';
  g.fillStyle = 'rgba(150,175,215,0.10)';
  g.beginPath(); g.moveTo(x, y + 120); g.lineTo(x + 200, y + 120); g.lineTo(x + 420, floorY + 120); g.lineTo(x + 130, floorY + 120); g.closePath(); g.fill();
  g.restore();
});

// 3) Tavan kirişi ve sarkıt lambalar
g.fillStyle = '#08090b'; g.fillRect(0, 0, W, 34);
const lamps = [190, 600, 1010];
function lampGlow() {
  lamps.forEach((x) => {
    g.save(); g.globalCompositeOperation = 'lighter';
    let cone = g.createLinearGradient(0, 230, 0, floorY + 80);
    cone.addColorStop(0, 'rgba(255,214,150,0.22)'); cone.addColorStop(1, 'rgba(255,214,150,0)');
    g.filter = 'blur(18px)'; g.fillStyle = cone;
    g.beginPath(); g.moveTo(x - 60, 236); g.lineTo(x + 60, 236); g.lineTo(x + 300, floorY + 80); g.lineTo(x - 300, floorY + 80); g.closePath(); g.fill();
    g.filter = 'none';
    let rg = g.createRadialGradient(x, 238, 0, x, 238, 120); rg.addColorStop(0, 'rgba(255,236,200,0.9)'); rg.addColorStop(0.15, 'rgba(255,210,150,0.35)'); rg.addColorStop(1, 'rgba(255,200,140,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, 238, 120, 0, Math.PI * 2); g.fill();
    g.restore();
  });
}
lamps.forEach((x) => {
  g.strokeStyle = '#050506'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, 34); g.lineTo(x, 200); g.stroke();
  g.fillStyle = '#16181c'; g.beginPath(); g.moveTo(x - 16, 200); g.lineTo(x + 16, 200); g.lineTo(x + 62, 236); g.lineTo(x - 62, 236); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(x - 14, 202, 6, 30);
});

// 4) Kum torbaları (ön planda kenarlarda, arkada küçük)
function bag(x, top, len, wid, col, lit) {
  g.strokeStyle = '#111'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x, 34); g.lineTo(x, top - 26); g.stroke();
  g.beginPath(); g.moveTo(x, top - 26); g.lineTo(x - wid * 0.35, top); g.moveTo(x, top - 26); g.lineTo(x + wid * 0.35, top); g.stroke();
  const bg2 = g.createLinearGradient(x - wid / 2, 0, x + wid / 2, 0);
  bg2.addColorStop(0, '#050506'); bg2.addColorStop(0.35 + lit * 0.2, col); bg2.addColorStop(1, '#050506');
  g.fillStyle = bg2;
  g.beginPath(); g.roundRect(x - wid / 2, top, wid, len, [wid * 0.2, wid * 0.2, wid * 0.45, wid * 0.45]); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(x - wid / 2, top + len * 0.18, wid, 6); g.fillRect(x - wid / 2, top + len * 0.8, wid, 6);
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(x - wid * 0.22, top + 6, 5, len - 30);
}
bag(380, 290, 230, 64, '#3a2a22', 0.3);
bag(820, 300, 220, 60, '#2b2f38', 0.6);
bag(120, 230, 380, 110, '#4a1518', 0.5);
bag(1090, 220, 400, 116, '#3b2a20', 0.1);

lampGlow();

// 5) Tatami zemin (perspektif)
const fg = g.createLinearGradient(0, floorY, 0, H); fg.addColorStop(0, '#1f2228'); fg.addColorStop(1, '#0a0b0d');
g.fillStyle = fg; g.fillRect(0, floorY, W, H - floorY);
g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 2;
for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(W / 2 + i * 70, floorY); g.lineTo(W / 2 + i * 200, H); g.stroke(); }
for (let k = 1; k < 6; k++) { const y = floorY + Math.pow(k / 6, 1.6) * (H - floorY); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
// kırmızı dövüş alanı şeridi
g.fillStyle = 'rgba(193,18,31,0.55)';
g.beginPath(); g.moveTo(W / 2 - 420, floorY + 40); g.lineTo(W / 2 + 420, floorY + 40); g.lineTo(W / 2 + 470, floorY + 58); g.lineTo(W / 2 - 470, floorY + 58); g.closePath(); g.fill();
// kettlebell ve ağırlık plakaları sağda, bank solda
[[930, 0.9], [985, 1.1], [1040, 0.8]].forEach(([x, k]) => { const y = floorY + 20; g.fillStyle = '#0c0d10'; g.beginPath(); g.ellipse(x, y, 24 * k, 22 * k, 0, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#0c0d10'; g.lineWidth = 7 * k; g.beginPath(); g.arc(x, y - 26 * k, 13 * k, Math.PI, 0); g.stroke(); g.fillStyle = 'rgba(255,230,190,0.12)'; g.beginPath(); g.ellipse(x - 8 * k, y - 8 * k, 6 * k, 9 * k, 0, 0, Math.PI * 2); g.fill(); });
g.fillStyle = '#101115'; g.fillRect(120, floorY - 40, 260, 22); g.fillRect(140, floorY - 18, 14, 40); g.fillRect(346, floorY - 18, 14, 40);
g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(120, floorY - 40, 260, 4);
// süpürgelik
g.fillStyle = '#060607'; g.fillRect(0, floorY - 8, W, 10);
// zemine düşen ışık lekeleri
lamps.forEach((x) => { const rg = g.createRadialGradient(x, floorY + 90, 0, x, floorY + 90, 300); rg.addColorStop(0, 'rgba(255,220,170,0.16)'); rg.addColorStop(1, 'rgba(255,220,170,0)'); g.fillStyle = rg; g.beginPath(); g.ellipse(x, floorY + 90, 300, 80, 0, 0, Math.PI * 2); g.fill(); });

// 6) Toz, vinyet, gren
g.save(); g.globalCompositeOperation = 'lighter';
for (let i = 0; i < 220; i++) { const x = R() * W, y = 60 + R() * 700; g.fillStyle = `rgba(255,235,205,${0.05 + R() * 0.18})`; g.beginPath(); g.arc(x, y, 0.7 + R() * 1.5, 0, Math.PI * 2); g.fill(); }
g.restore();
const vg = g.createRadialGradient(W / 2, H * 0.48, 200, W / 2, H * 0.5, 820); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
g.fillStyle = vg; g.fillRect(0, 0, W, H);
const img = g.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
g.putImageData(img, 0, 0);
window.DONE = true;
</script></body></html>
