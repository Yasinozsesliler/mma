<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1200" height="400"></canvas>
<script>
// Kamp yeri başlık bantları (1200x400): ?scene=ev|tayland|dagistan|brezilya|irtifa|elit. Marka ve yazı yok.
const c = document.getElementById('c'); const g = c.getContext('2d'); const W = c.width, H = c.height;
let seed = 11; const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const SCENE = new URLSearchParams(location.search).get('scene') || 'tayland';
const sky = (stops) => { const gr = g.createLinearGradient(0, 0, 0, H); stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
const glow = (x, y, r, col) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
function ridge(base, amp, col, step = 40, rough = 1) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
  let y = base;
  for (let x = 0; x <= W + step; x += step) { y = base - amp * (0.5 + 0.5 * Math.sin(x * 0.006 * rough + base)) - R() * amp * 0.35; g.lineTo(x, y); }
  g.lineTo(W, H); g.closePath(); g.fill();
}
function palm(x, y, h, s) {
  g.strokeStyle = '#07060a'; g.lineWidth = 10 * s; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 30 * s, y - h * 0.6, x + 12 * s, y - h); g.stroke();
  g.fillStyle = '#07060a';
  for (let i = 0; i < 7; i++) { const a = -Math.PI + (i / 6) * Math.PI; g.beginPath(); g.ellipse(x + 12 * s + Math.cos(a) * 60 * s, y - h + Math.sin(a) * 20 * s + 12 * s, 66 * s, 10 * s, a * 0.6, 0, Math.PI * 2); g.fill(); }
}
function pine(x, y, h) { g.fillStyle = '#05080a'; g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + h * 0.22, y); g.lineTo(x - h * 0.22, y); g.closePath(); g.fill(); }
function stars(n, maxY) { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(255,255,255,${0.3 + R() * 0.6})`; g.fillRect(R() * W, R() * maxY, 1.6, 1.6); } }

if (SCENE === 'tayland') {
  sky([[0, '#2a0f3a'], [0.45, '#c2410c'], [0.75, '#f59e0b'], [1, '#1a0a06']]);
  glow(820, 250, 260, 'rgba(255,200,120,0.75)');
  g.fillStyle = '#ffd59a'; g.beginPath(); g.arc(820, 250, 52, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(40,20,30,0.55)'; g.fillRect(0, 300, W, 100);
  ridge(310, 40, '#2a1220', 50);
  // açık hava Muay Thai ringi: teneke çatı, direkler, halatlar
  g.fillStyle = '#0a0608'; g.beginPath(); g.moveTo(260, 150); g.lineTo(760, 150); g.lineTo(820, 190); g.lineTo(200, 190); g.closePath(); g.fill();
  [230, 790].forEach((x) => { g.fillRect(x - 6, 190, 12, 170); });
  g.fillRect(230, 330, 566, 40);
  ['#e63946', '#f1f2f5', '#1c4fc4'].forEach((col, i) => { g.strokeStyle = col; g.globalAlpha = 0.8; g.lineWidth = 4; g.beginPath(); g.moveTo(236, 262 + i * 22); g.lineTo(790, 262 + i * 22); g.stroke(); });
  g.globalAlpha = 1;
  palm(110, 400, 300, 1.1); palm(1040, 400, 260, 0.95); palm(1150, 400, 200, 0.7);
} else if (SCENE === 'dagistan') {
  sky([[0, '#0b1220'], [0.5, '#2b3a55'], [1, '#0a0d12']]);
  stars(80, 140);
  ridge(200, 110, '#3b4a63', 40, 1.4);
  // karlı tepeler
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(220,230,255,0.18)'; ridge(150, 60, 'rgba(220,230,255,0.10)', 30, 2); g.restore();
  ridge(290, 70, '#1a2232', 40, 0.9);
  // taş ev ve sarı pencere ışığı
  g.fillStyle = '#0b0d12'; g.fillRect(760, 240, 200, 130); g.beginPath(); g.moveTo(740, 245); g.lineTo(860, 190); g.lineTo(980, 245); g.closePath(); g.fill();
  g.fillStyle = '#ffcf7a'; g.fillRect(800, 280, 34, 30); g.fillRect(890, 280, 34, 30);
  glow(860, 300, 160, 'rgba(255,190,100,0.25)');
  ridge(360, 25, '#07090d', 60);
} else if (SCENE === 'brezilya') {
  sky([[0, '#0c1d3a'], [0.55, '#1f6f6a'], [0.8, '#e0a43a'], [1, '#0a1210']]);
  glow(600, 300, 300, 'rgba(255,210,120,0.35)');
  // şeker kafası dağı silueti ve deniz
  g.fillStyle = '#061015'; g.beginPath(); g.moveTo(700, 320); g.bezierCurveTo(740, 120, 860, 110, 900, 320); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(520, 320); g.bezierCurveTo(560, 230, 640, 230, 680, 320); g.closePath(); g.fill();
  g.fillStyle = 'rgba(10,30,40,0.9)'; g.fillRect(0, 318, W, 82);
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,220,150,${0.1 + R() * 0.3})`; g.fillRect(R() * W, 325 + R() * 60, 20 + R() * 60, 2); }
  palm(80, 400, 280, 1); palm(1120, 400, 300, 1.05);
  // yeşil-sarı tatami şeridi
  g.fillStyle = '#0f6b3a'; g.fillRect(0, 380, W, 20); g.fillStyle = '#f2c14e'; g.fillRect(0, 376, W, 4);
} else if (SCENE === 'irtifa') {
  sky([[0, '#05070f'], [0.6, '#16223b'], [1, '#05070a']]);
  stars(160, 220);
  g.fillStyle = 'rgba(230,236,255,0.85)'; g.beginPath(); g.arc(950, 80, 26, 0, Math.PI * 2); g.fill(); glow(950, 80, 120, 'rgba(200,215,255,0.25)');
  ridge(240, 90, '#1b2740', 40, 1.2);
  // göl yansıması
  g.fillStyle = '#0b1424'; g.fillRect(0, 300, W, 100);
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(200,215,255,${0.05 + R() * 0.12})`; g.fillRect(900 + (R() - 0.5) * 120, 305 + R() * 80, 30 + R() * 50, 2); }
  for (let x = -20; x < W + 20; x += 26 + R() * 24) pine(x, 310 + R() * 10, 90 + R() * 110);
  // kulübe ışığı
  g.fillStyle = '#0a0d12'; g.fillRect(260, 262, 120, 50); g.fillStyle = '#ffcf7a'; g.fillRect(290, 278, 22, 18); glow(300, 290, 90, 'rgba(255,190,100,0.3)');
} else if (SCENE === 'elit') {
  sky([[0, '#05080f'], [1, '#0c1220']]);
  // cam duvar, mavi LED şeritleri, koşu bantları ve ağırlık rafları silueti
  g.strokeStyle = 'rgba(120,180,255,0.18)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 120) { g.beginPath(); g.moveTo(x, 40); g.lineTo(x, 300); g.stroke(); }
  g.fillStyle = 'rgba(90,160,255,0.08)'; g.fillRect(0, 40, W, 260);
  [40, 300].forEach((y) => { g.fillStyle = '#3aa8ff'; g.fillRect(0, y, W, 4); g.save(); g.globalCompositeOperation = 'lighter'; g.filter = 'blur(10px)'; g.fillStyle = 'rgba(58,168,255,0.6)'; g.fillRect(0, y - 6, W, 16); g.restore(); });
  for (let i = 0; i < 5; i++) { const x = 120 + i * 210; g.fillStyle = '#05070b'; g.fillRect(x, 270, 150, 26); g.fillRect(x + 110, 200, 10, 76); g.fillRect(x + 90, 196, 50, 10); g.fillStyle = '#3aa8ff'; g.fillRect(x + 100, 200, 20, 6); }
  g.fillStyle = '#0a0e16'; g.fillRect(0, 300, W, 100);
  for (let x = 0; x < W; x += 60) { g.fillStyle = 'rgba(255,255,255,0.04)'; g.fillRect(x, 300, 2, 100); }
  glow(600, 160, 420, 'rgba(120,180,255,0.12)');
} else {
  // ev: garaj salonu — ahşap duvar, tek ampul, asılı torba, yerde minder
  sky([[0, '#1a120c'], [1, '#0b0806']]);
  for (let x = 0; x < W; x += 70) { g.fillStyle = `rgba(${70 + R() * 30 | 0},${45 + R() * 20 | 0},${28},0.55)`; g.fillRect(x, 0, 66, 320); }
  g.fillStyle = '#0f0b08'; g.fillRect(0, 320, W, 80);
  g.strokeStyle = '#050403'; g.lineWidth = 2; g.beginPath(); g.moveTo(600, 0); g.lineTo(600, 70); g.stroke();
  g.fillStyle = '#ffe1a8'; g.beginPath(); g.arc(600, 82, 13, 0, Math.PI * 2); g.fill();
  glow(600, 82, 420, 'rgba(255,200,130,0.35)');
  g.fillStyle = '#2a0d10'; g.beginPath(); g.roundRect(820, 120, 70, 200, [14, 14, 30, 30]); g.fill(); g.strokeStyle = '#050403'; g.beginPath(); g.moveTo(855, 0); g.lineTo(855, 120); g.stroke();
  g.fillStyle = '#1a2a4a'; g.fillRect(200, 330, 360, 30);
  // pencereden sokak lambası
  g.fillStyle = '#0c1220'; g.fillRect(120, 80, 160, 110); g.fillStyle = 'rgba(255,200,120,0.25)'; g.fillRect(130, 90, 140, 90);
}

// ortak: alta doğru koyulaşma, vinyet, gren
const fade = g.createLinearGradient(0, 0, 0, H); fade.addColorStop(0, 'rgba(0,0,0,0.15)'); fade.addColorStop(0.65, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,0.55)');
g.fillStyle = fade; g.fillRect(0, 0, W, H);
const img = g.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
g.putImageData(img, 0, 0);
window.DONE = true;
</script></body></html>
