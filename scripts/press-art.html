<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1200" height="720"></canvas>
<script>
// Basın toplantısı ve tartı sahnesi: arka pano (logosuz desen), kırmızı ışık şeridi, iki spot, sahne platformu,
// önde foto muhabiri siluetleri ve kamera flaşları. Marka yok; organizasyon adı oyunda üstüne yazılır.
const c = document.getElementById('c'); const g = c.getContext('2d'); const W = c.width, H = c.height;
let seed = 21; const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const stageY = 520;

// 1) Arka pano: koyu lacivert-siyah, altıgen desen
let bg = g.createLinearGradient(0, 0, 0, stageY); bg.addColorStop(0, '#0c0f18'); bg.addColorStop(1, '#151a26');
g.fillStyle = bg; g.fillRect(0, 0, W, stageY);
g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 2;
const hs = 46;
for (let row = 0; row * hs * 0.86 < stageY + hs; row++) {
  for (let col = -1; col * hs * 1.5 < W + hs; col++) {
    const x = col * hs * 1.5 + (row % 2 ? hs * 0.75 : 0), y = row * hs * 0.86;
    g.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; const px = x + Math.cos(a) * hs * 0.45, py = y + Math.sin(a) * hs * 0.45; k ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.closePath(); g.stroke();
  }
}
// pano çerçevesi ve kırmızı ışık şeritleri
g.fillStyle = '#c1121f'; g.fillRect(0, 70, W, 6); g.fillRect(0, stageY - 90, W, 6);
g.save(); g.globalCompositeOperation = 'lighter'; g.filter = 'blur(14px)'; g.fillStyle = 'rgba(230,57,70,0.55)'; g.fillRect(0, 64, W, 18); g.fillRect(0, stageY - 96, W, 18); g.restore();
// ortada geniş koyu bant (organizasyon adı oyunda buraya yazılır)
let band = g.createLinearGradient(0, 0, W, 0); band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(0.5, 'rgba(0,0,0,0.55)'); band.addColorStop(1, 'rgba(0,0,0,0)');
g.fillStyle = band; g.fillRect(0, 140, W, 160);

// 2) Spotlar
[[330, '#ffd9dc'], [870, '#d6e4ff']].forEach(([x, col]) => {
  g.save(); g.globalCompositeOperation = 'lighter'; g.filter = 'blur(26px)';
  const cg = g.createLinearGradient(0, 0, 0, stageY + 80); cg.addColorStop(0, col + 'aa'); cg.addColorStop(1, col + '00');
  g.globalAlpha = 0.35; g.fillStyle = cg;
  g.beginPath(); g.moveTo(x - 40, 0); g.lineTo(x + 40, 0); g.lineTo(x + 260, stageY + 60); g.lineTo(x - 260, stageY + 60); g.closePath(); g.fill();
  g.restore();
  const rg = g.createRadialGradient(x, stageY + 30, 0, x, stageY + 30, 300); rg.addColorStop(0, 'rgba(255,245,230,0.25)'); rg.addColorStop(1, 'rgba(255,245,230,0)');
  g.fillStyle = rg; g.beginPath(); g.ellipse(x, stageY + 30, 300, 70, 0, 0, Math.PI * 2); g.fill();
});

// 3) Sahne platformu
let st = g.createLinearGradient(0, stageY, 0, stageY + 90); st.addColorStop(0, '#2a2e38'); st.addColorStop(0.15, '#16181e'); st.addColorStop(1, '#08090b');
g.fillStyle = st; g.fillRect(0, stageY, W, 90);
g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(0, stageY, W, 3);
g.fillStyle = '#c1121f'; g.fillRect(0, stageY + 84, W, 4);
// ortada tartı (baskül) silueti
g.fillStyle = '#0e1014'; g.fillRect(W / 2 - 70, stageY - 6, 140, 12);
g.fillStyle = '#1b1e25'; g.fillRect(W / 2 - 8, stageY - 150, 16, 146);
g.fillStyle = '#0e1014'; g.beginPath(); g.roundRect(W / 2 - 46, stageY - 196, 92, 56, 8); g.fill();
g.fillStyle = 'rgba(230,57,70,0.85)'; g.font = '700 30px Oswald, Impact, monospace'; g.textAlign = 'center'; g.fillText('00.0', W / 2, stageY - 158);

// 4) Ön plan: foto muhabirleri ve flaşlar
const fy = H;
for (let i = 0; i < 16; i++) {
  const x = (i / 15) * W + (R() - 0.5) * 40, s = 0.9 + R() * 0.5;
  g.fillStyle = '#040405';
  g.beginPath(); g.ellipse(x, fy - 20 * s, 58 * s, 70 * s, 0, Math.PI, 0); g.fill();
  g.beginPath(); g.arc(x, fy - 100 * s, 24 * s, 0, Math.PI * 2); g.fill();
  if (R() < 0.6) { g.fillRect(x + 10 * s, fy - 128 * s, 34 * s, 24 * s); g.fillRect(x + 36 * s, fy - 122 * s, 18 * s, 12 * s); }
}
g.save(); g.globalCompositeOperation = 'lighter';
for (let i = 0; i < 9; i++) {
  const x = 60 + R() * (W - 120), y = fy - 110 - R() * 60, r = 50 + R() * 70;
  const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, 'rgba(255,255,255,0.95)'); rg.addColorStop(0.1, 'rgba(230,240,255,0.5)'); rg.addColorStop(1, 'rgba(200,220,255,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
g.restore();

// 5) Vinyet ve gren
const vg = g.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.5, 760); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)');
g.fillStyle = vg; g.fillRect(0, 0, W, H);
const img = g.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
g.putImageData(img, 0, 0);
window.DONE = true;
</script></body></html>
